name: pigeon_prepare
description: Sort and index GFF/GTF files for use with pigeon classify.
keywords:
  - isoseq
  - pigeon
  - prepare
  - index
  - sort
tools:
  - pigeon:
      description: Transcript Toolkit for classification and filtering of Iso-Seq data.
      homepage: https://isoseq.how/pigeon/
      documentation: https://isoseq.how/pigeon/
      licence: ["PacBio"]
input:
  - input:
      type: file
      description: GFF or GTF file to be prepared.
      pattern: "*.{gff,gtf}"
  - fasta:
      type: file
      description: Optional reference genome FASTA file (required when preparing reference GTF).
      pattern: "*.{fasta,fa}"
output:
  - prepared:
      type: file
      description: Sorted and indexed GFF/GTF file.
      pattern: "*.sorted.*"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@aidantay"
